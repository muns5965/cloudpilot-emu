// Stage 2-C test APK: arm64-v8a only, OS 5 core + SDL2. Versions are pinned here and in
// .github/workflows/android-apk.yml; SDL sources come from tools/android-fetch-deps.sh.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'io.github.muns5965.cloudpilot'
    compileSdk = 35
    buildToolsVersion = '35.0.0'
    ndkVersion = '27.2.12479018'

    defaultConfig {
        applicationId = 'io.github.muns5965.cloudpilot.test'
        minSdk = 26
        targetSdk = 35
        versionCode = 3
        versionName = '0.3-2c'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file('jni/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../deps/SDL/android-project/app/src/main/java']
        }
    }

    // Native libraries stored uncompressed (and 16 KiB aligned by AGP), loaded from the APK.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
