# Build check only: OS 5 core as an arm64-v8a shared library with a pinned Android NDK.
# No APK, no ROM, no deploy. Runs on verify/android-* branches only.
name: Android core build check

on:
  push:
    branches: ["verify/android-**"]

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          grep Pkg.Revision "$NDK/source.properties"
          grep -q "Pkg.Revision = $NDK_VERSION" "$NDK/source.properties"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Build and check core library
        run: tools/android-core-check.sh build-android-core 2>&1 | tee check.log; exit ${PIPESTATUS[0]}

      # Result summary as annotations (readable through the checks API without the log archive).
      - name: Summary
        if: always()
        run: |
          note() { printf '::notice title=%s::%s\n' "$1" "$(head -c 3500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          grep -v '^ *[0-9]* [a-z]' check.log | note result || true
          grep 'warning:' check.log build-android-core/compile.log 2>/dev/null | sed 's/.*warning: //' | sort | uniq -c | sort -rn | note warnings || true
          grep -B2 -A3 'error:' build-android-core/compile.log 2>/dev/null | note compile-errors || true
          note link < build-android-core/link.log 2>/dev/null || true
          tr '\n' ' ' < build-android-core/undefined.txt | fold -w 200 | note undefined || true
          grep 'warning:' build-android-core/compile.log | sed 's/: warning:.*//' | sed "s|$PWD/||" | sort | uniq -c | note warning-files || true

      - name: Check for ROM files
        if: always()
        run: |
          if find build-android-core -type f \( -iname '*.rom' -o -iname '*.nor' -o -iname '*.bin' -o -iname '*.img' -o -iname '*.ses' \) | grep .; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-core-arm64-v8a
          path: |
            check.log
            build-android-core/compile.log
            build-android-core/link.log
            build-android-core/undefined.txt
            build-android-core/libuarmcore.so
          retention-days: 14
