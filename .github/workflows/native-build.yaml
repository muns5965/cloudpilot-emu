name: Compile native app on Linux
on:
  push:
    branches:
      - '*'
jobs:
  build:
    # 24.04: its gcc-arm-none-eabi builds the built-in VZ90 DAL (tools/vz90-dal/gen.py)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Install dependencies
        run: 'sudo apt-get update && sudo apt-get -y install build-essential libreadline-dev libcurl4-openssl-dev libsdl2-image-dev libsdl2-dev gcc-arm-none-eabi'
      - name: Build
        run: "echo 'CFLAGS_NATIVE = -Werror -O0 -DENABLE_DEBUGGER $(shell sdl2-config --cflags)' > src/Makefile.local && make -j2 bin"
    
